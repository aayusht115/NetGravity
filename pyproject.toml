[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netgravity"
version = "7.0.0"
description = "NetGravity — AI Decision Intelligence & MILP Optimization Platform for Supply Chain & Logistics Networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    { name = "NetGravity Engineering Team", email = "netgravity@kearney.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pulp>=2.8.0,<3.0.0",
    "pydantic>=2.0.0",
    "highspy>=1.5.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["netgravity/tests"]
python_files = "test_*.py"
markers = [
    "slow: large-scale benchmarks (deselect with -m 'not slow')",
]
